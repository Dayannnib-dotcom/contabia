services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: contabia
      POSTGRES_USER: contabia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mude-esta-senha}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabia"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://contabia:${POSTGRES_PASSWORD:-mude-esta-senha}@db:5432/contabia
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ficheiro .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  dados:
