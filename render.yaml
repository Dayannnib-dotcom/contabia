# Render Blueprint — servidor + base de dados PostgreSQL permanente, ambos na UE (Frankfurt), por causa do RGPD.
# A região não pode ser mudada depois de criada.
databases:
  - name: contabia-db-eu
    region: frankfurt
    plan: free
    databaseName: contabia
    user: contabia

services:
  - type: web
    name: contabia-eu
    region: frankfurt
    runtime: docker
    plan: free
    healthCheckPath: /v1/saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contabia-db-eu
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # E-mails (recuperar senha) pelo Brevo, fornecedor europeu. Preencha no painel do Render.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: EMAIL_ESTUDOS
        sync: false
      - key: AUTOMACAO_URL
        sync: false
      - key: AUTOMACAO_SEGREDO
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_NUMERO_ID
        sync: false
      - key: WHATSAPP_APP_SEGREDO
        sync: false
      - key: WHATSAPP_VERIFICAR
        sync: false
