# Render Blueprint — FASE DE TESTES (só dados fictícios). Servidor + PostgreSQL permanente.
# Antes do primeiro cliente real, migrar para a UE com render.eu.yaml (ver README).
databases:
  - name: contabia-db
    plan: free
    databaseName: contabia
    user: contabia

services:
  - type: web
    name: contabia
    runtime: docker
    plan: free
    healthCheckPath: /v1/saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contabia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # E-mails (recuperar senha) pelo Brevo, fornecedor europeu. Preencha no painel do Render.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
