# CONFIGURAÇÃO PARA PRODUÇÃO NA UE (Frankfurt) — usar ANTES do primeiro cliente real (RGPD).
# Como migrar: no GitHub, apague render.yaml e mude o nome deste ficheiro para render.yaml;
# no Render, crie um Blueprint novo a partir do repositório. A região não pode ser mudada depois.
# Enquanto só houver dados de teste, fica em uso o render.yaml (Oregon).
databases:
  - name: contabia-db-eu
    region: frankfurt
    plan: free
    databaseName: contabia
    user: contabia

services:
  - type: web
    name: contabia-eu
    region: frankfurt
    runtime: docker
    plan: free
    healthCheckPath: /v1/saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contabia-db-eu
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # E-mails (recuperar senha) pelo Brevo, fornecedor europeu. Preencha no painel do Render.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
